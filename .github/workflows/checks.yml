name: Check extension
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:updater
      - run: bun run package
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
      - run: bun run test:browser
        env:
          EXTENSION_DIR: dist/release/extension
          CHROME_BIN: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: test-results/
          retention-days: 7
